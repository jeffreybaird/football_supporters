      four_attributes: "Your four attributes"
      ranking_archetypes: "Ranking · archetypes"
      ranking_teams: "Ranking · equal vs your weights"
      move_vs_equal: "▲▼ move vs equal"
      sim_table: "Similarity table · top-2 gap %{gap} · %{count} candidate%{plural} within %{threshold} · tap a team to read its blurb"
      vector_weights: "Your vector · weights [%{weights}]"
      per_league_fit: "Per-league fit · match %"
      read_blurb: "Read this club's blurb"

    sliders:
      eyebrow: "Last bit · what matters to you"
      heading: "How much does each thing count?"
      intro: "These are relative priorities — sliding everything to the top is the same as leaving everything in the middle. Only the balance between them changes your match."
      show_club: "Show my club →"

    result:

# section at the bottom holds the questionnaire and archetype WORDING (question,
# slider, and archetype label/sentence text); the language-neutral scoring numbers
# live in config/quiz/ (questions/*.yml and archetypes.yml). Every translated
# locale (see fr.yml) mirrors the same keys.

  # ---- quiz content: English text for the questionnaire ----
  # The numeric scoring skeleton (loadings/option values) is language-neutral
  # and lives in config/quiz/questions/*.yml; this is only the wording. fr.yml
  # mirrors these keys. Assembled by Quiz::Data.questions / .sliders.
  content:
    questions:
      V2:
        t: "A game's on with no team of yours involved. You want"
        a:
          - "the better team to win comfortably"
          - "a close, exciting game either way"
          - "the weaker team to cause an upset"
          - "I only watch the teams I support"
      V4:
        t: "A team you love has a great year. When it's going well, you"
        a:
          - "make sure people know about it"
          - "enjoy it privately"
          - "celebrate with other fans of my team"
          - "dislike being the one everyone wants to beat"
      V10:
        t: "Someone is clearly wrong in a comment section. You"
        a:
          - "reply and argue it out"
          - "write the perfect response in your head but don't post"
          - "scroll past it"
          - "follow the internet's golden rule, never read the comments"
      P1:
        t: "Your ideal way to win"
        a:
          - "in control the whole way, 2-0"
          - "a wild high-scoring game, 4-2"
          - "defending a narrow lead, 1-0"
          - "a chaotic game that ends in a draw with a last-minute equaliser"
      P3:
        t: "Away from sport, how you tend to operate"
        a:
          - "work to a clear plan"
          - "keep a loose framework and adapt"
          - "go on instinct"
          - "deal with things as they come"
      P5:
        t: "The kind of person you'd want in charge"
        a:
          - "meticulous, has drilled every detail"
          - "an idealist who wants to do it well"
          - "a pragmatist focused on results"
          - "a motivator who lets people off the leash"
      P8:
        t: "You'd rather watch a team that"
        a:
          - "controls the game and grinds it out"
          - "attacks relentlessly and takes risks"
          - "defends deep and counters"
          - "competes hard regardless of style"
      E2:
        t: "Has anything a club did ever changed how you felt about supporting them?"
        a:
          - "Yes — enough that I stopped, or never started"
          - "Yes — it changed things, but I stayed"
          - "Not really — I've never had to think about it"
          - "No — what happens off the pitch isn't the club to me"
      E3:
        t: "Your favorite spot, the one you actually look forward to, gets bought by someone you'd cross the street to avoid. Nothing else about it changes."
        a:
          - "I'd stop going for good"
          - "I'd go less, and it'd feel off every time"
          - "I'd keep going and try not to think about it"
          - "I'd keep going, it's the same place"
      F3:
        t: "The type of city or town you'd prefer to live"
        a:
          - "my hometown"
          - "somewhere unpretentious with character"
          - "a big city with everything available"
          - "wherever the best opportunities are"
      F4:
        t: "How do you engage with the fandoms you're part of?"
        a:
          - "All in — I follow everything and I'm part of the community"
          - "I consume all of it, but from home"
          - "I follow it casually"
          - "I only show up for the big moments"
      F5:
        t: "The crowd you'd rather be part of"
        a:
          - "loud and intense"
          - "passionate but well-behaved"
          - "relaxed and comfortable"
          - "quiet, with good facilities"
      F7:
        t: "The kind of place you'd choose to live"
        a:
          - "close-knit, families there for generations"
          - "mixed and up-and-coming"
          - "newly built and convenient"
          - "the most desirable area you can afford"
    sliders:
      Vibe:
        q: "How much does the club's size and status matter?"
        lo: "Doesn't matter"
        hi: "Matters a lot"
      Play:
        q: "How much does the style of football matter?"
        lo: "Doesn't matter"
        hi: "Matters a lot"
      Ethics:
        q: "How much does who owns the club, and how they behave, matter?"
        lo: "Doesn't matter"
        hi: "Matters a lot"
      Fanbase:
        q: "How much does fitting in with the fanbase matter?"
        lo: "Doesn't matter"
        hi: "Matters a lot"
    archetypes:
      club_idealist:
        label: "The Romantic"
        sentence: "You want a club you can love, not just follow. One with a story you can tell, a sense of purpose you can feel. It's the people beside you in the stands, the songs that echo after the final whistle, the feeling that you're part of something bigger than a single season. Wins and losses fade, but the meaning keeps you coming back."
      weekend_giant:
        label: "The Light Brigade"
        sentence: "You want the big club, the full ground, and a team that rides at everything with the handbrake off. Up the hill, into the valley, over the wall — running towards the enemy with bayonets fixed. Glory over caution, the charge over a safe draw. You want a club with an identity that outshines its trophy case."
      big_club_believer:
        label: "The Cavalier"
        sentence: "You want the big club and the bright lights. A team that steps onto the pitch with swagger, playing for the crowd, the cameras, and the silverware. The business side, the politics, the fine print—let someone else worry about that. You're here for the show, and you're not sorry about it."
      cathedral_builder:
        label: "The Architect"
        sentence: "You want a club on the rise that plays with a sense that each pass is part of a bigger picture. Every season, a competent back office is a step toward something lasting. In the stands, you feel the hope of people who believe in a shared vision."
      pragmatic_winner:
        label: "The Pragmatic Winner"
        sentence: "You want a club that gets the job done, no matter how it looks. A win is a win, as long as it's honest. You'll take the scrappy goals and the hard-fought points, but you won't celebrate a title that was bought instead of earned."
      glory_hunter:
        label: "The Glory Hunter"
        sentence: "You want a club that fills your Saturdays, the kind you'd wear on your back and sing for until your voice is gone. However they play, whoever's in charge, you're there for every minute, no questions asked."
      trophy_collector:
        label: "The Trophy Collector"
        sentence: "You want a club that brings home trophies, and you won't say sorry for wanting silverware. The rest—how they play, who owns them—doesn't matter as much as what's in the cabinet. That's what you'll remember, and that's what you'll show off."
      student_of_the_game:
        label: "The Student of the Game"
        sentence: "You love the game for its own sake—the way a move unfolds, the players who make you sit up and take notice, the moments you replay in your mind days later. You'll follow a club, but only if it fits your love of football. The badge is just a detail."
      terrace_dreamer:
        label: "The Terrace Dreamer"
        sentence: "You want a club where the faces are familiar and the songs feel like your own. The stand is a second home, and the people around you are more than strangers. You hope the owners are decent, and you trust what you're told."
      everyfan:
        label: "The Everyfan"
        sentence: "You want a club that holds its own, with owners you can accept, and a place in your week that feels real but doesn't take over your life. However they play, you're just glad to call it yours."
      principled_fan:
        label: "The Principled Fan"
        sentence: "You want a club you can support without second thoughts. Who owns it and how they act comes first. The football and the sense of belonging matter, but not enough to ignore what's wrong."
      easygoing_supporter:
        label: "The Matinee"
        sentence: "You want a club you can enjoy without needing to study up. Football is supposed to be a good afternoon out, not another job. You're not going to ruin it by worrying about the finances."
      free_agent:
        label: "The Free Agent"
        sentence: "You want to watch football your way—wherever the best match is, whoever's on the pitch. No club owns your loyalty, and you don't feel bad about it for a second."
      parish_purist:
        label: "The Village Green"
        sentence: "You want a club that belongs to its town and isn't an asset in a private equity firm's portfolio. It's the ground down the road and the same faces every week. What division or league the team plays in matters less than their place in the table and their connection to your community."
      hometown_diehard:
        label: "The Hometown Diehard"
        sentence: "You want the club just down the road, and you want every bit of it—every home match, every away trip, every song until your voice is gone. It's family, and you don't keep score with family."
      local_enthusiast:
        label: "The Local Enthusiast"
        sentence: "You want the team that belongs to your town, whatever kind of football they play. It's one good thing in your week, not the only thing. But if the owners don't respect the place, you won't stand with them."
      family_day:
        label: "The Family Day"
        sentence: "You want to spend the afternoon at the local ground, kids by your side, maybe an ice cream on the way home no matter the result. You hope the club is in good hands, but mostly you're here for the day out."
      local_casual:
        label: "The Local Casual"
        sentence: "You want football to stay close to home, something you can take or leave. If a ticket comes your way, you'll enjoy it. If not, you're just as happy."
      all_mid:
        label: "The All-Rounder"
        sentence: "This is the kind of club you want: no single thing dominates — you'll take a good club in almost any shape."

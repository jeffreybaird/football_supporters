# English — the source language. These strings mirror the literals in the ERB
# views and the React client so `t` always has an English fallback. The quiz
# CONTENT (questions, sliders, archetypes) stays canonical in Ruby, so this file
# has no `content:` section; only translated locales (see fr.yml) carry one.
en:
  language_name: "English"

  # <html lang> and <title> fallback
  html_lang: "en"

  titles:
    default: "Which Club Should You Support?"
    profile: "Your Football Profile"
    league: "Which %{name} Club Should You Support?"
    club_result: "I should support %{name} — Which %{league} Club Should You Support?"
    profile_result: "My Football Profile — %{label}"

  # The language switcher drawer (server-rendered in the layout, on every page).
  drawer:
    trigger: "Language"
    heading: "Language"
    subheading: "Choose how this site reads."
    close: "Close"
    current: "Current"

  result:
    eyebrow_single: "Full time · your club"
    eyebrow_close: "Full time · a close call"
    share_label: "Share your result"
    share_url_aria: "Shareable link to your result"
    share_copy: "Copy link"
    share_native: "Share ↗"
    share_text: "I should support %{name}."
    alts_label: "Or maybe you're more…"
    take_quiz: "Take the quiz →"
    feedback_link: "Have any feedback?"
    badge_alt: "%{name} crest"

  profile_result:
    eyebrow: "Full time · your football profile"
    clubs_aria: "Your club in each league"
    share_label: "Share your profile"
    share_text: "My football profile: %{label}."
    match_unit: "% match"

  not_found:
    heading: "No match here"
    body: "That result link doesn't exist — it may have been mistyped or removed."
    take_quiz: "Take the quiz →"

  feedback:
    page_title: "Send feedback"
    thanks_page_title: "Thanks"
    eyebrow: "Extra time · over to you"
    title_line1: "Have any"
    title_accent: "feedback?"
    lede: "Wrong club? A league missing? Copy that reads badly, a crest that won't load, a question that made no sense? Let me know!"
    message_label: "Your feedback"
    required: "Required"
    optional: "Optional"
    message_placeholder: "Tell me what's wrong — or what worked."
    email_label: "Your email"
    email_placeholder: "you@example.com"
    email_hint: "Only so I can reply. Leave it blank and your note stays anonymous."
    error_tag: "Error"
    honeypot_label: "Leave this field empty"
    submit: "Send it →"
    cancel: "← Back to the quiz"
    note: "No newsletter. No tracking. One person reads these."
    generic_error: "Something went wrong."
    thanks_eyebrow: "Full time · whistle gone"
    thanks_title_line1: "Got it."
    thanks_title_accent: "Thank you."
    thanks_lede: "Your note is on its way to me. If you left an email I'll write back when I can — and if you didn't, it's still read."
    thanks_back: "Back to the quiz →"

  # ---- React client strings (embedded as window.QUIZ_I18N) ----
  client:
    boot:
      loading: "Loading…"
      error_title: "Something went wrong loading the quiz."
      error_body: "This page needs an internet connection (it loads React from a CDN). If you are online and still see this, try a hard refresh."
      libs_error: "Libraries did not load (React/ReactDOM/Babel). Check your connection or try again."

    axes:
      Vibe: "Vibe"
      Play: "Play"
      Ethics: "Ethics"
      Fanbase: "Fanbase"

    nav:
      restart: "↺ Restart"
      restart_title: "Restart from the first question"
      coach_view: "Coach's view"

    titles:
      profile: "Your Football Profile"
      league: "Which %{name} Club Should You Support?"

    picker:

# The language-neutral archetype scoring model. The copy (label + sentence)
# per id lives in config/locales/*.yml under content.archetypes (English +
# translations); this holds only the numeric lattice Quiz::Archetype scores on.
#
# levels: per-axis low/mid/high anchors (percentiles of the user-vector
#   distribution). cells: the 81 V-P-E-F codes, each mapped to the archetype
#   that owns it (order is load-bearing — ties in nearest-cell keep this
#   order). scatter: cross-axis coupling that makes slider weights meaningful.
#   See Quiz::Archetype for the full algorithm and the SCATTER sweep.
levels:
  Vibe: { low: 4.14, mid: 5.235, high: 6.33 }
  Play: { low: 5.0, mid: 6.07, high: 7.14 }
  Ethics: { low: 2.0, mid: 4.12, high: 6.24 }
  Fanbase: { low: 4.07, mid: 5.105, high: 6.14 }

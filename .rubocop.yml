plugins:
  - rubocop-rspec
  - rubocop-sequel

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - "db/migrations/**/*"
    - "db/seed-data/**/*"
    - "vendor/**/*"
    - "public/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude:
    - "app/services/quiz/archetype.rb" # long copywritten sentences, one per line

Metrics/ModuleLength:
  Exclude:
    - "app/services/quiz/archetype.rb" # data table, not logic
    - "app/services/quiz/seed.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 5

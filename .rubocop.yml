plugins:
  - rubocop-rspec
  - rubocop-sequel

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - "db/migrations/**/*"
    - "db/seed-data/**/*"
    - "vendor/**/*"
    - "public/**/*"

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude:
    - "app/services/quiz/archetype.rb" # long copywritten sentences, one per line
    - "app/services/quiz/seed.rb"      # club blurb copy, one long string per line
    - "app/services/quiz/data.rb"      # quiz question copy, one long string per line

Metrics/ModuleLength:
  Exclude:
    - "app/services/quiz/archetype.rb" # data table, not logic
    - "app/services/quiz/seed.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# Grandfathered: cohesive, well-tested `call` methods (or dense recommender
# maths in score.rb) that would only get worse — more indirection to trace —
# if split apart to satisfy a line-count metric. New files still get the
# default thresholds.
Metrics/AbcSize:
  Exclude:
    - "app.rb"
    - "app/services/quiz/client_data.rb"
    - "app/services/quiz/create.rb"
    - "app/services/quiz/create_profile.rb"
    - "app/services/quiz/score.rb"
    - "app/services/quiz/seed.rb"

Metrics/MethodLength:
  Exclude:
    - "app/services/quiz/client_data.rb"
    - "app/services/quiz/create.rb"
    - "app/services/quiz/create_profile.rb"
    - "app/services/quiz/score.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "app/services/quiz/client_data.rb"
    - "app/services/quiz/score.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "app/services/quiz/client_data.rb"
    - "app/services/quiz/score.rb"

Metrics/ParameterLists:
  Exclude:
    - "app/services/quiz/score.rb"    # per-league tuning kwargs, all named
    - "app/services/quiz/seed.rb"     # positional team-row shape from seed data

Metrics/ClassLength:
  Exclude:
    - "app.rb"

RSpec/DescribedClass:
  Enabled: false # this codebase spells out the class name in specs on purpose

RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 8 # request specs assert the full rendered response in one example
